name: Build iOS IPA
on:
  push:
    branches:
      - work/ios-qemu-runtime
    paths:
      - .github/workflows/build-ipa.yml
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Build again even if this commit already has a successful IPA"
        required: false
        default: false
        type: boolean
permissions:
  actions: read
  contents: write


jobs:
  preflight:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      skip_build: ${{ steps.duplicate.outputs.skip_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate build scripts and project inputs
        run: |
          set -euo pipefail
          bash -n scripts/vendor-stikjit.sh
          bash -n scripts/create-iphone4-8gb-nand.sh
          bash -n scripts/stage-qemu-iphone4.sh
          python3 -m py_compile scripts/patch-qemu-ios-gles-enums.py
          test -s ios/project.yml
          test -s ios/Info.plist
          test -s scripts/vendor-stikjit.sh
      - name: Avoid rebuilding an already successful commit
        id: duplicate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
            echo "Forced rebuild requested."
            exit 0
          fi
          EXISTING="$(gh run list --workflow build-ipa.yml --branch "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq 'length')"
          if [ "$EXISTING" -gt 0 ]; then
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "This exact commit already has a successful IPA build; skipping the expensive macOS job."
          else
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi

  build-ipa:
    needs: preflight
    if: ${{ needs.preflight.outputs.skip_build != 'true' }}
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Calculate version from successful IPA builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SUCCESSFUL_BUILDS="$(gh run list --workflow build-ipa.yml --branch "$GITHUB_REF_NAME" --status success --limit 1000 --json databaseId --jq 'length')"
          NEXT_VERSION_INDEX="$((SUCCESSFUL_BUILDS + 1))"
          VERSION="$(python3 - "$NEXT_VERSION_INDEX" <<'PY'
          import sys
          n = int(sys.argv[1])
          if n < 1:
              raise SystemExit("GITHUB_RUN_NUMBER must be positive")
          if n <= 16:
              major, minor, patch = 0, 0, n
          else:
              remaining = n - 17
              raw_minor = 1 + remaining // 17
              patch = remaining % 17
              major = raw_minor // 33
              minor = raw_minor % 33
          if major > 128 or (major, minor, patch) > (128, 32, 16):
              import secrets, string
              alphabet = string.digits + string.ascii_uppercase + string.ascii_lowercase
              print("".join(secrets.choice(alphabet) for _ in range(16)))
          else:
              print(f"{major}.{minor}.{patch}")
          PY
          )"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            BUNDLE_VERSION="$VERSION"
          else
            BUNDLE_VERSION="128.32.16"
          fi
          echo "ASTRA_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ASTRA_BUNDLE_VERSION=$BUNDLE_VERSION" >> "$GITHUB_ENV"
          echo "Building Project Astra $VERSION (successful IPA build #$NEXT_VERSION_INDEX)"
      - name: Verify QEMU-iOS engine source
        run: |
          set -euo pipefail
          test -f vendor/qemu-engine/contrib/ios-app/qemu-ios-entry.c
          test -f vendor/qemu-engine/contrib/ios-app/qemu-ios-ui.c
          test -f vendor/qemu-engine/docs/n90/README.md
          ENGINE_SHA="$(git -C vendor/qemu-engine rev-parse HEAD)"
          echo "QEMU-iOS engine checked out at $ENGINE_SHA"
          test "$ENGINE_SHA" = "db230fe8e8e4d297724b2eccdc38bdc21876696a"
      - name: Select Xcode
        run: |
          set -euo pipefail
          echo "Installed Xcode applications:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' -print | sort -V | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then XCODE_APP="/Applications/Xcode.app"; fi
          test -d "$XCODE_APP/Contents/Developer"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Selected iPhoneOS SDK: $SDK_VERSION"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          if [ "$SDK_MAJOR" -lt 26 ]; then
            echo "Project Astra's on-device pairing code uses iOS 26 SDK APIs; install/select Xcode 26 or newer." >&2
            exit 1
          fi
      - name: Build and verify QEMU iOS engine
        env:
          QEMU_IOS_BUILD_ROOT: ${{ runner.temp }}/qemu-ios
          DEVICE_TARGET: iphone4
        run: |
          set -euo pipefail
          bash scripts/build-qemu-ios-engine.sh
          ENGINE_FILE="ios/Frameworks/libqemu-arm.dylib"
          test -s "$ENGINE_FILE"
          lipo "$ENGINE_FILE" -verify_arch arm64
          for symbol in qemu_ios_main qemu_ios_ui_attach qemu_ios_ui_frame qemu_ios_ui_touch; do
            nm -gU "$ENGINE_FILE" | grep -q " _$symbol$"
          done
          echo "Built and verified the QEMU iOS engine from the pinned source."
      - name: Install XcodeGen only when missing
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          else
            xcodegen --version
          fi
      - name: Download precompiled Astra StikJIT package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PREBUILD_RUN="$(gh run list --workflow build-stikjit.yml --branch "$GITHUB_REF_NAME" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$PREBUILD_RUN" ]; then
            mkdir -p "$RUNNER_TEMP/stikjit-prebuilt"
            gh run download "$PREBUILD_RUN" --name Project-Astra-StikJIT-Prebuilt --dir "$RUNNER_TEMP/stikjit-prebuilt"
            PACKAGE="$RUNNER_TEMP/stikjit-prebuilt/astra-stikjit-prebuilt.tar.gz"
            if [ -s "$PACKAGE" ]; then
              tar -xzf "$PACKAGE" -C "$GITHUB_WORKSPACE"
            else
              echo "No usable StikJIT artifact found; building the pinned sources locally."
              bash scripts/vendor-stikjit.sh
            fi
          else
            echo "No successful StikJIT prebuild exists yet; building the pinned sources locally."
            bash scripts/vendor-stikjit.sh
          fi
          EXPECTED_SCRIPT_SHA="$(shasum -a 256 scripts/vendor-stikjit.sh | awk '{print $1}')"
          ACTUAL_SCRIPT_SHA="$(python3 -c 'import json; print(json.load(open("ios/Resources/stikjit-prebuilt.json"))["vendor_script_sha256"])')"
          test "$EXPECTED_SCRIPT_SHA" = "$ACTUAL_SCRIPT_SHA"
          test -s ios/build/lib/libastra_rppairing.a
          test -s ios/Frameworks/StikJIT.xcframework/ios-arm64/StikJIT.framework/StikJIT
          test -s ios/Resources/astra-jit.js
          test -s ios/Sources/AstraJITHelper/AstraJITHelper.swift
      - name: Validate 8 GB NAND preset
        run: |
          set -euo pipefail
          NAND_DIR="$RUNNER_TEMP/n90-8gb-nand-test"
          sh scripts/create-iphone4-8gb-nand.sh "$NAND_DIR"
          python3 - "$NAND_DIR" <<'PY'
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          g = json.loads((root / "geometry.json").read_text())
          assert g == {
              "storage_format": "nand-xor-ff-v2",
              "chip_id": "b614d5ad",
              "buses": 2,
              "ce_per_bus": 2,
              "blocks_per_ce": 4096,
              "pages_per_block": 128,
              "page_bytes": 4096,
              "spare_bytes": 128,
          }
          pages_per_ce = g["blocks_per_ce"] * g["pages_per_block"]
          expected_file_size = pages_per_ce * (g["page_bytes"] + g["spare_bytes"])
          expected_capacity = g["buses"] * g["ce_per_bus"] * pages_per_ce * g["page_bytes"]
          assert expected_capacity == 8 * 1024**3
          files = sorted(root.glob("bus*-ce*.pages"))
          assert len(files) == 4
          assert all(p.stat().st_size == expected_file_size for p in files)
          print(f"Verified {expected_capacity} bytes of raw NAND data capacity")
          PY
          if sh scripts/create-iphone4-8gb-nand.sh "$NAND_DIR"; then
            echo "Generator should refuse to overwrite an existing NAND directory" >&2
            exit 1
          fi
      # Reuse Xcode build products and module caches across repeated IPA builds.
      - name: Restore Xcode build cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/DerivedData
          key: astra-xcode-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/project.yml', 'ios/Info.plist', 'ios/Sources/**/*.swift', 'ios/Sources/**/*.h', 'ios/Sources/**/*.m', 'ios/Resources/**', 'ios/Frameworks/**') }}
          restore-keys: |
            astra-xcode-${{ runner.os }}-${{ runner.arch }}-

      - name: Generate project
        run: xcodegen generate --spec ios/project.yml --project ios
      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild -project ios/QEMULegacyIOS.xcodeproj -scheme QEMULegacyIOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" ASTRA_VERSION="$ASTRA_VERSION" ASTRA_BUNDLE_VERSION="$ASTRA_BUNDLE_VERSION" ASTRA_BUILD_NUMBER="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH/PlugIns/AstraJITHelper.appex"
          test -s "$APP_PATH/Frameworks/StikJIT.framework/StikJIT"
          test -s "$APP_PATH/astra-jit.js"
          mkdir -p "$APP_PATH/Frameworks"
          cp ios/Frameworks/libqemu-arm.dylib "$APP_PATH/Frameworks/libqemu-arm.dylib"
          test -s "$APP_PATH/Frameworks/libqemu-arm.dylib"
          lipo "$APP_PATH/Frameworks/libqemu-arm.dylib" -verify_arch arm64
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/Project-Astra-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: Project-Astra-unsigned-ipa
          path: Project-Astra-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Publish successful IPA to GitHub Releases
        if: ${{ vars.ASTRA_RELEASES_ENABLED == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="astra-v$ASTRA_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$TAG" Project-Astra-unsigned.ipa \
            --title "Project Astra $ASTRA_VERSION" \
            --notes "Automated Project Astra IPA build. This is an unsigned IPA; installation requires a compatible signing method."
