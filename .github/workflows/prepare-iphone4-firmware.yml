name: Prepare Legacy iPhone Firmware Bundles

on:
  workflow_dispatch:
    inputs:
      firmware:
        description: Firmware profile to prepare
        required: true
        type: choice
        default: both
        options:
          - both
          - ios-6.1.3
          - ios-7.1.2
          - iphone2g-ios-1.0

permissions:
  contents: write

concurrency:
  group: prepare-legacy-iphone-firmware
  cancel-in-progress: false

jobs:
  prepare:
    name: Build prepared legacy iPhone firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Require a private repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PRIVATE="$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)"
          if [ "$PRIVATE" != "true" ]; then
            echo "::error::This workflow creates archives containing Apple firmware. Set this repository to private before generating or storing the bundles."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq squashfs-tools zip libegl1 libgl1 libopengl0 libglib2.0-0 libdbus-1-3 libx11-6 libxext6 libxrender1 libxrandr2 libxfixes3 libxcursor1 libxi6 libxinerama1 libxkbcommon0 libxcb1 libxcb-xinerama0 libxcb-cursor0 libfontconfig1 libfreetype6 libsm6 libice6 libfdt1

      - name: Download FirmwareKit runtime
        run: |
          set -euo pipefail
          APPIMAGE="$RUNNER_TEMP/LightTouch-v0.0.13-Linux-x86_64.AppImage"
          curl -fL --retry 5 --retry-delay 3 \
            "https://github.com/blake-lucas/LightTouch/releases/download/v0.0.13/LightTouch-v0.0.13-Linux-x86_64.AppImage" \
            -o "$APPIMAGE"
          echo "e08b2e1dd8b44aadb838a85d78098744cf5185279f902e2d80be9f4a01cf83e2  $APPIMAGE" | sha256sum --check
          chmod +x "$APPIMAGE"
          (cd "$RUNNER_TEMP" && "$APPIMAGE" --appimage-extract >/dev/null)
          mv "$RUNNER_TEMP/squashfs-root" "$RUNNER_TEMP/lighttouch-app"
          FWKIT="$(find "$RUNNER_TEMP/lighttouch-app" -type f -name firmwarekit -print -quit)"
          test -n "$FWKIT"
          RESOURCES="$(dirname "$FWKIT")"
          test -f "$RESOURCES/libqemu-arm.so"
          test -d "$RESOURCES/guest-tools"
          echo "FWKIT=$FWKIT" >> "$GITHUB_ENV"
          echo "RESOURCES=$RESOURCES" >> "$GITHUB_ENV"
          echo "APP_ROOT=$RUNNER_TEMP/lighttouch-app" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RESOURCES:$RUNNER_TEMP/lighttouch-app/lib:$RUNNER_TEMP/lighttouch-app/usr/lib" >> "$GITHUB_ENV"
          "$FWKIT" oneshot '{"mode":{"machines":{}}}' >/dev/null

      - name: Download firmware catalog
        run: |
          set -euo pipefail
          curl -fL --retry 5 \
            "https://raw.githubusercontent.com/blake-lucas/LightTouch/v0.0.13/Portable/firmware/firmware-catalog.json" \
            -o "$RUNNER_TEMP/firmware-catalog.json"
          jq -e '.format == 1 and (.entries | type == "array")' "$RUNNER_TEMP/firmware-catalog.json" >/dev/null

      - name: Prepare selected firmware builds
        id: prepare
        env:
          FIRMWARE_SELECTION: ${{ inputs.firmware }}
        run: |
          set -euo pipefail
          mkdir -p prepared
          case "$FIRMWARE_SELECTION" in
            iphone2g-ios-1.0)
              BOARD="m68ap"
              BUILD="1A543a"
              VERSION="1.0"
              PRODUCT="iPhone1,1"
              DEVICE_NAME="iPhone2G"
              ;;
            both)
              BOARD="n90ap"
              BUILDS=(10B329 11D257)
              VERSIONS=(6.1.3 7.1.2)
              PRODUCTS=(iPhone3,1 iPhone3,1)
              DEVICE_NAME="iPhone4-GSM"
              ;;
            ios-6.1.3)
              BOARD="n90ap"
              BUILDS=(10B329)
              VERSIONS=(6.1.3)
              PRODUCTS=(iPhone3,1)
              DEVICE_NAME="iPhone4-GSM"
              ;;
            ios-7.1.2)
              BOARD="n90ap"
              BUILDS=(11D257)
              VERSIONS=(7.1.2)
              PRODUCTS=(iPhone3,1)
              DEVICE_NAME="iPhone4-GSM"
              ;;
            *)
              echo "::error::Unknown firmware selection: $FIRMWARE_SELECTION"
              exit 1
              ;;
          esac

          if [ "$BOARD" = "m68ap" ]; then
            BUILDS=("$BUILD")
            VERSIONS=("$VERSION")
            PRODUCTS=("$PRODUCT")
          fi

          for INDEX in "${!BUILDS[@]}"; do
            BUILD="${BUILDS[$INDEX]}"
            VERSION="${VERSIONS[$INDEX]}"
            PRODUCT="${PRODUCTS[$INDEX]}"

            META="$RUNNER_TEMP/firmware-$BUILD.json"
            python3 - "$RUNNER_TEMP/firmware-catalog.json" "$BOARD" "$BUILD" "$META" <<'PY'
          import json, sys
          catalog_path, board, build, out = sys.argv[1:]
          catalog = json.load(open(catalog_path))
          matches = [e for e in catalog["entries"] if e.get("board") == board and e.get("build") == build]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one {board} catalog entry for {build}; found {len(matches)}")
          json.dump(matches[0], open(out, "w"))
          print(f"Selected {matches[0]['id']} ({matches[0]['version']} / {build})")
          PY
            ENTRY_ID="$(jq -r .id "$META")"

            IPSW_META="$RUNNER_TEMP/ipsw-$BUILD.json"
            python3 - "$PRODUCT" "$BUILD" "$IPSW_META" <<'PY'
          import json, sys, urllib.request
          product, build, out = sys.argv[1:]
          url = f"https://api.ipsw.me/v4/device/{product}?type=ipsw"
          with urllib.request.urlopen(url, timeout=60) as response:
              data = json.load(response)
          matches = [f for f in data.get("firmwares", []) if f.get("buildid") == build]
          if len(matches) != 1:
              raise SystemExit(f"ipsw.me returned {len(matches)} IPSW entries for {product} build {build}")
          fw = matches[0]
          if not fw.get("url") or not fw.get("sha1sum"):
              raise SystemExit(f"ipsw.me entry for {build} is missing its download URL or SHA-1")
          json.dump(fw, open(out, "w"))
          print(f"ipsw.me: {fw.get('version')} / {build} / {fw.get('filename')}")
          PY
            IPSW_URL="$(jq -r .url "$IPSW_META")"
            IPSW_SHA1="$(jq -r .sha1sum "$IPSW_META")"
            IPSW_FILE="$RUNNER_TEMP/$PRODUCT-$BUILD.ipsw"

            echo "Downloading $PRODUCT iOS $VERSION ($BUILD) from ipsw.me..."
            curl -fL --retry 5 --retry-delay 5 --continue-at - "$IPSW_URL" -o "$IPSW_FILE"
            echo "$IPSW_SHA1  $IPSW_FILE" | sha1sum --check

            OUT="$RUNNER_TEMP/$BOARD-$BUILD"
            echo "Running FirmwareKit for $ENTRY_ID..."
            "$FWKIT" create \
              --catalog "$RUNNER_TEMP/firmware-catalog.json" \
              --id "$ENTRY_ID" \
              --ipsw "$IPSW_FILE" \
              --out "$OUT" \
              --guest-tools "$RESOURCES/guest-tools" \
              --skip-setup

            if [ "$BOARD" = "m68ap" ]; then
              test -s "$OUT/iBoot.bin"
              test -s "$OUT/nor.bin"
              test -d "$OUT/nand"
              test "$(find "$OUT/nand" -type f | wc -l)" -gt 0
              # The S5L8900 boot ROM is not in an IPSW. Include the public
              # emulator project's ROM asset only in this private-repository
              # artifact; never publish Apple firmware from a public repo.
              curl -fL --retry 5 --retry-delay 3 \
                "https://github.com/devos50/qemu-ios/releases/download/n45ap_v1/bootrom_s5l8900" \
                -o "$OUT/bootrom_s5l8900"
              test -s "$OUT/bootrom_s5l8900"
            else
              test -s "$OUT/kboot.bin"
              test -d "$OUT/nand"
              test "$(find "$OUT/nand" -type f | wc -l)" -gt 0
            fi
            echo "Validated prepared $BOARD bundle for $BUILD"

            ARCHIVE="QEMU-$DEVICE_NAME-iOS-$VERSION-$BUILD.zip"
            (cd "$RUNNER_TEMP" && zip -q -9 -r "$GITHUB_WORKSPACE/prepared/$ARCHIVE" "$BOARD-$BUILD")
            SIZE="$(stat -c%s "prepared/$ARCHIVE")"
            if [ "$SIZE" -ge 2000000000 ]; then
              echo "::error::The prepared bundle archive is at least 2 GB, exceeding GitHub's per-release-asset limit."
              exit 1
            fi
            sha256sum "prepared/$ARCHIVE" >> prepared/SHA256SUMS
            rm -f "$IPSW_FILE"
            rm -rf "$OUT"
          done

          echo "archives=$(find prepared -maxdepth 1 -name '*.zip' -printf '%f ')" >> "$GITHUB_OUTPUT"

      - name: Upload prepared bundles as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: QEMU-Legacy-iPhone-prepared-firmware
          path: prepared/*
          if-no-files-found: error
          retention-days: 14
