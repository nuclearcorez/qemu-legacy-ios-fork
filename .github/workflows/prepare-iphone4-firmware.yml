name: Prepare iPhone 4 Firmware Bundles

on:
  workflow_dispatch:
    inputs:
      firmware:
        description: Firmware version(s) to prepare for iPhone 4 GSM
        required: true
        type: choice
        default: both
        options:
          - both
          - ios-6.1.3
          - ios-7.1.2

permissions:
  contents: write

concurrency:
  group: prepare-iphone4-firmware
  cancel-in-progress: false

jobs:
  prepare:
    name: Build prepared N90AP firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Validate encrypted-public-artifact configuration
        env:
          FIRMWARE_ARCHIVE_PASSWORD: ${{ secrets.FIRMWARE_ARCHIVE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${FIRMWARE_ARCHIVE_PASSWORD:-}" ] || [ "${#FIRMWARE_ARCHIVE_PASSWORD}" -lt 32 ]; then
            echo "::error::Add a strong FIRMWARE_ARCHIVE_PASSWORD repository secret (at least 32 characters) before running this workflow."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq squashfs-tools zip libegl1 libgl1 libopengl0 libglib2.0-0 libdbus-1-3 libx11-6 libxext6 libxrender1 libxrandr2 libxfixes3 libxcursor1 libxi6 libxinerama1 libxkbcommon0 libxcb1 libxcb-xinerama0 libxcb-cursor0 libfontconfig1 libfreetype6 libsm6 libice6 libfdt1

      - name: Download FirmwareKit runtime
        run: |
          set -euo pipefail
          APPIMAGE="$RUNNER_TEMP/LightTouch-v0.0.13-Linux-x86_64.AppImage"
          curl -fL --retry 5 --retry-delay 3 \
            "https://github.com/blake-lucas/LightTouch/releases/download/v0.0.13/LightTouch-v0.0.13-Linux-x86_64.AppImage" \
            -o "$APPIMAGE"
          echo "e08b2e1dd8b44aadb838a85d78098744cf5185279f902e2d80be9f4a01cf83e2  $APPIMAGE" | sha256sum --check
          chmod +x "$APPIMAGE"
          (cd "$RUNNER_TEMP" && "$APPIMAGE" --appimage-extract >/dev/null)
          mv "$RUNNER_TEMP/squashfs-root" "$RUNNER_TEMP/lighttouch-app"
          FWKIT="$(find "$RUNNER_TEMP/lighttouch-app" -type f -name firmwarekit -print -quit)"
          test -n "$FWKIT"
          RESOURCES="$(dirname "$FWKIT")"
          test -f "$RESOURCES/libqemu-arm.so"
          test -d "$RESOURCES/guest-tools"
          echo "FWKIT=$FWKIT" >> "$GITHUB_ENV"
          echo "RESOURCES=$RESOURCES" >> "$GITHUB_ENV"
          echo "APP_ROOT=$RUNNER_TEMP/lighttouch-app" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RESOURCES:$RUNNER_TEMP/lighttouch-app/lib:$RUNNER_TEMP/lighttouch-app/usr/lib" >> "$GITHUB_ENV"
          "$FWKIT" oneshot '{"mode":{"machines":{}}}' >/dev/null

      - name: Download firmware catalog
        run: |
          set -euo pipefail
          curl -fL --retry 5 \
            "https://raw.githubusercontent.com/blake-lucas/LightTouch/v0.0.13/Portable/firmware/firmware-catalog.json" \
            -o "$RUNNER_TEMP/firmware-catalog.json"
          jq -e '.format == 1 and (.entries | type == "array")' "$RUNNER_TEMP/firmware-catalog.json" >/dev/null

      - name: Prepare selected firmware builds
        id: prepare
        env:
          FIRMWARE_SELECTION: ${{ inputs.firmware }}
        run: |
          set -euo pipefail
          mkdir -p prepared
          if [ "$FIRMWARE_SELECTION" = "both" ]; then
            BUILDS=(10B329 11D257)
          elif [ "$FIRMWARE_SELECTION" = "ios-6.1.3" ]; then
            BUILDS=(10B329)
          else
            BUILDS=(11D257)
          fi

          for BUILD in "${BUILDS[@]}"; do
            case "$BUILD" in
              10B329) VERSION="6.1.3";;
              11D257) VERSION="7.1.2";;
              *) echo "Unsupported build: $BUILD" >&2; exit 1;;
            esac

            META="$RUNNER_TEMP/firmware-$BUILD.json"
            python3 - "$RUNNER_TEMP/firmware-catalog.json" "$BUILD" "$META" <<'PY'
          import json, sys
          catalog_path, build, out = sys.argv[1:]
          catalog = json.load(open(catalog_path))
          matches = [e for e in catalog["entries"] if e.get("board") == "n90ap" and e.get("build") == build]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one N90AP catalog entry for {build}; found {len(matches)}")
          json.dump(matches[0], open(out, "w"))
          print(f"Selected {matches[0]['id']} ({matches[0]['version']} / {build})")
          PY
            ENTRY_ID="$(jq -r .id "$META")"

            IPSW_META="$RUNNER_TEMP/ipsw-$BUILD.json"
            python3 - "$BUILD" "$IPSW_META" <<'PY'
          import json, sys, urllib.request
          build, out = sys.argv[1:]
          url = "https://api.ipsw.me/v4/device/iPhone3,1?type=ipsw"
          with urllib.request.urlopen(url, timeout=60) as response:
              data = json.load(response)
          matches = [f for f in data.get("firmwares", []) if f.get("buildid") == build]
          if len(matches) != 1:
              raise SystemExit(f"ipsw.me returned {len(matches)} IPSW entries for iPhone3,1 build {build}")
          fw = matches[0]
          if not fw.get("url") or not fw.get("sha1sum"):
              raise SystemExit(f"ipsw.me entry for {build} is missing its download URL or SHA-1")
          json.dump(fw, open(out, "w"))
          print(f"ipsw.me: {fw.get('version')} / {build} / {fw.get('filename')}")
          PY
            IPSW_URL="$(jq -r .url "$IPSW_META")"
            IPSW_SHA1="$(jq -r .sha1sum "$IPSW_META")"
            IPSW_FILE="$RUNNER_TEMP/iPhone3,1-$BUILD.ipsw"

            echo "Downloading iPhone3,1 iOS $VERSION ($BUILD) from ipsw.me..."
            curl -fL --retry 5 --retry-delay 5 --continue-at - "$IPSW_URL" -o "$IPSW_FILE"
            echo "$IPSW_SHA1  $IPSW_FILE" | sha1sum --check

            OUT="$RUNNER_TEMP/n90ap-$BUILD"
            echo "Running FirmwareKit for $ENTRY_ID..."
            "$FWKIT" create \
              --catalog "$RUNNER_TEMP/firmware-catalog.json" \
              --id "$ENTRY_ID" \
              --ipsw "$IPSW_FILE" \
              --out "$OUT" \
              --guest-tools "$RESOURCES/guest-tools" \
              --skip-setup

            test -s "$OUT/kboot.bin"
            test -d "$OUT/nand"
            test "$(find "$OUT/nand" -type f | wc -l)" -gt 0
            echo "Validated kboot.bin and populated NAND directory for $BUILD"

            ARCHIVE="QEMU-iPhone4-GSM-iOS-$VERSION-$BUILD.zip"
            (cd "$RUNNER_TEMP" && zip -q -9 -r "$GITHUB_WORKSPACE/prepared/$ARCHIVE" "n90ap-$BUILD")
            SIZE="$(stat -c%s "prepared/$ARCHIVE")"
            if [ "$SIZE" -ge 2000000000 ]; then
              echo "::error::The prepared bundle archive is at least 2 GB, exceeding GitHub's per-release-asset limit."
              exit 1
            fi
            sha256sum "prepared/$ARCHIVE" >> prepared/SHA256SUMS
            rm -f "$IPSW_FILE"
            rm -rf "$OUT"
          done

          echo "archives=$(find prepared -maxdepth 1 -name '*.zip' -printf '%f ')" >> "$GITHUB_OUTPUT"

      - name: Encrypt prepared firmware archives
        env:
          FIRMWARE_ARCHIVE_PASSWORD: ${{ secrets.FIRMWARE_ARCHIVE_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(prepared/*.zip)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::No prepared firmware archives were produced."
            exit 1
          fi
          for archive in "${archives[@]}"; do
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 \
              -pass env:FIRMWARE_ARCHIVE_PASSWORD \
              -in "$archive" -out "$archive.enc"
            rm -f "$archive"
          done
          rm -f prepared/SHA256SUMS
          (cd prepared && sha256sum *.zip.enc > SHA256SUMS)
          if find prepared -maxdepth 1 -type f -name '*.zip' | grep -q .; then
            echo "::error::A plaintext firmware archive remains in the output directory."
            exit 1
          fi

      - name: Upload encrypted firmware archives as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: QEMU-iPhone4-GSM-encrypted-firmware
          path: prepared/*
          if-no-files-found: error
          retention-days: 14
